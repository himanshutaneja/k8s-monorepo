name: Build and Deploy to Local K8s

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Converts the repository name to lowercase to safely match Docker naming rules
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      run: |
        docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p "${{ secrets.GITHUB_TOKEN }}"

    - name: Build and Push Docker Images
      shell: pwsh
      run: |
        # Use GitHub Actions functions to force lowercase strings natively
        $backendTag = "${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }}".ToLower()
        $frontendTag = "${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}".ToLower()
        
        # Build images
        docker build -t $backendTag ./backend
        docker build -t $frontendTag ./frontend
        
        # Push images to GHCR
        docker push $backendTag
        docker push $frontendTag
        
        # Save tags to environment variables for subsequent steps
        echo "BACKEND_TAG=$backendTag" >> $env:GITHUB_ENV
        echo "FRONTEND_TAG=$frontendTag" >> $env:GITHUB_ENV

    - name: Deploy to Minikube
      shell: pwsh
      run: |
        # Use PowerShell formatting to safely swap placeholders in files on Windows
        (Get-Content k8s/backend-deployment.yaml) -replace '__BACKEND_IMAGE_TAG__', "${{ env.BACKEND_TAG }}" | Set-Content k8s/backend-deployment.yaml
        (Get-Content k8s/frontend-deployment.yaml) -replace '__FRONTEND_IMAGE_TAG__', "${{ env.FRONTEND_TAG }}" | Set-Content k8s/frontend-deployment.yaml
        
        # Deploy using your local machine's kubectl context
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml

